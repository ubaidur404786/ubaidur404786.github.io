<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Ubaid Ur Rehman</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f6f9;--paper:#fff;--text:#14213d;--muted:#5b6475;--line:#d9dee7;--navy:#1f3a5f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Calibri,"Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{max-width:1000px;margin:0 auto;padding:22px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;color:var(--navy)}
header a{color:var(--muted);font-size:.95rem}
.pick{max-width:1000px;margin:0 auto;padding:8px 16px}
.lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{font:600 .95rem Calibri,"Segoe UI",sans-serif;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer}
.row button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bar{max-width:1000px;margin:14px auto 8px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar b{color:var(--navy)}
.dl{background:var(--navy);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700}
.view{max-width:1000px;margin:0 auto 40px;padding:0 16px}
iframe{width:100%;height:1300px;border:1px solid var(--line);border-radius:8px;background:#fff}
@media(max-width:700px){iframe{height:80vh}}
</style>
</head>
<body>
<header><h1>Ubaid Ur Rehman · CV</h1><a href="./">← Back to site</a></header>
<div class="pick">
  <div class="lbl">Role</div>
  <div class="row" id="roles">
    <button data-r="ML_Engineer">Junior ML Engineer</button>
    <button data-r="AI_Engineer">Junior AI Engineer</button>
    <button data-r="Data_Scientist">Junior Data Scientist</button>
    <button data-r="Detailed">Detailed CV · 2 pages</button>
  </div>
  <div class="lbl">Language</div>
  <div class="row" id="langs">
    <button data-l="EN">English</button>
    <button data-l="FR">Français</button>
  </div>
</div>
<div class="bar"><span id="name"></span><a class="dl" id="dl" download>Download PDF</a></div>
<div class="view"><iframe id="pdf" title="CV preview"></iframe></div>
<script>
const P=new URLSearchParams(location.search);
const label={ML_Engineer:'Junior ML Engineer',AI_Engineer:'Junior AI Engineer',Data_Scientist:'Junior Data Scientist',Detailed:'Detailed CV · 2 pages'};
let r=label[P.get('role')]?P.get('role'):'AI_Engineer', l=P.get('lang')==='FR'?'FR':'EN';
function show(){
  const f=`cv/Ubaid_Ur_Rehman_CV_${r}_${l}.pdf`;
  document.getElementById('pdf').src=f+'#view=FitH';
  const d=document.getElementById('dl'); d.href=f; d.setAttribute('download',f.slice(3));
  document.getElementById('name').innerHTML=`<b>${label[r]}</b> · ${l==='EN'?'English':'Français'}`;
  document.querySelectorAll('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  history.replaceState(null,'',`?role=${r}&lang=${l}`);
}
document.querySelectorAll('#roles button').forEach(b=>b.onclick=()=>{r=b.dataset.r;show()});
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{l=b.dataset.l;show()});
show();
</script>
</body>
</html>
